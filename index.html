<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习舱 StudyHub · 一句话变待办</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F6FED'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%E8%88%B1%3C/text%3E%3C/svg%3E">
<link rel="preload" href="assets/dist/app.min.js" as="script">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">舱</span>
      <div class="brand-text">
        <strong>学习舱</strong>
        <small>四级 · 六级 · 每日计划</small>
      </div>
    </div>
    <div class="topbar-right">
      <span class="sync-state" id="syncState" data-status="local" title="本地保存">本地保存</span>
      <span class="demo-tag" id="demoTag" hidden>演示数据</span>
      <span class="topbar-date" id="topbarDate"></span>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <span class="tab-section">学习</span>
    <button class="tab" data-view="today">今日</button>
    <button class="tab active" data-view="full">学习</button>
    <button class="tab" data-view="sprint">冲刺</button>
    <span class="tab-section">收集</span>
    <button class="tab" data-view="inbox">收件箱</button>
    <button class="tab" data-view="draft">草稿</button>
    <span class="tab-section">复盘</span>
    <button class="tab tab-practice" data-view="practice">▶ 练习</button>
    <button class="tab" data-view="review">复盘</button>
    <button class="tab tab-settings" data-view="settings">设置</button>
  </nav>

  <main class="view" id="view">
    <div class="loading">正在加载学习舱……<br><small>首次约 5–10 秒，之后浏览器会缓存</small></div>
  </main>

  <footer class="footer">本地优先 · 云端同步可选 · 数据保存在浏览器或云端 · 解析不联网</footer>
</div>

<!-- 计时进行中的常驻控制条（固定定位，放在 .app 外避免打乱 grid） -->
<div class="timer-bar" id="timerBar" hidden></div>

<script>
setTimeout(function () {
  var v = document.getElementById('view');
  if (v && v.querySelector('.loading')) {
    v.innerHTML = '<div class="loading">加载时间较长，可能是网络或 DNS 问题。<br>' +
      '<button class="btn" onclick="location.reload()">重试</button><br>' +
      '<small>手机可切换到流量；电脑可把 DNS 改为 223.5.5.5 或 119.29.29.29。</small></div>';
  }
}, 15000);
</script>
        <script defer src="assets/dist/app.min.js"></script>
  <script defer src="assets/js/sync.js"></script>
</body>
</html>
